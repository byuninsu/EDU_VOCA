plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}
// Firebase requires this project's configuration for the startup login gate.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
android {
    namespace "com.dailyenglish.edu_voca"
    compileSdk 36
    ndkVersion flutter.ndkVersion
    buildToolsVersion "36.0.0"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.dailyenglish.edu_voca"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    // Flutter does not run on 32-bit x86; skip sherpa-onnx's x86 TTS libraries.
    packaging {
        jniLibs {
            excludes += ['lib/x86/**']
        }
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
flutter { source '../..' }
